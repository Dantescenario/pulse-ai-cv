name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DATABASE_PATH: ${{ github.workspace }}/pulseai-ci.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12 and pip cache
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install native CV runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxcb1 libgl1 libegl1 libgles2 libglib2.0-0 libportaudio2
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Verify native CV imports
        run: python -c "import cv2, mediapipe, numpy; from mediapipe.tasks.python import vision"
      - name: Run complete backend test suite
        run: python -B -m unittest discover -s backend/tests -v

  frontend:
    name: Frontend tests, lint and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 22 and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run all frontend utility tests
        run: node --test src/utils/*.test.mjs
      - name: Run configured frontend lint checks
        run: npm run lint
      - name: Build production frontend
        run: npm run build
